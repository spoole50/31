[pytest]
testpaths = tests
addopts = -q
# The app targets Python 3.11; locally you may be on a newer interpreter where
# starlette/fastapi trip asyncio.iscoroutinefunction's deprecation. Silence just
# that one so real warnings stay visible.
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
